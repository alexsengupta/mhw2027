<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMHWS-1 participants</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IMHWS-1 PARTICIPANTS — accordion holding the two community graphics

   One iframe in Wix, two collapsible panels inside it. Each panel
   loads its graphic the first time it is opened, so the animation
   plays when someone actually looks at it.

   TO CHANGE A TITLE OR ADD A PANEL, edit the PANELS array in the
   script at the foot of this file.
   ============================================================ */
:root{
  --ink:#1d2b39; --muted:#6f8295; --navy:#0c356a; --blue:#0b5aaf;
  --rule:#dde7f2; --hover:#f5f9fd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;overflow-x:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:4px 16px 8px}

.acc{border-top:1px solid var(--rule)}
.item{border-bottom:1px solid var(--rule)}
.head{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:16px;width:100%;
      padding:20px 10px;cursor:pointer;border-radius:10px;transition:background .2s ease}
.head:hover{background:var(--hover)}
.head:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* small gradient badge echoing the timeline's cool-to-hot rail */
.badge{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
       background:linear-gradient(135deg,#0b5aaf,#3f9fc4 45%,#ffad3d 80%,#df2a2f);color:#fff}
.badge svg{width:22px;height:22px}
.txt{flex:1;min-width:0}
.title{display:block;font-size:clamp(17px,2.2vw,21px);font-weight:700;line-height:1.3}
.sub{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
.chev{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;
      color:var(--navy);transition:transform .35s ease,background .2s ease}
.chev svg{width:16px;height:16px}
.item.open .chev{transform:rotate(180deg);background:#eaf2fb}

.body{overflow:hidden;height:0;transition:height .45s cubic-bezier(.3,.8,.3,1)}
.inner{padding:4px 0 18px}
.body iframe{display:block;width:100%;border:0;height:0;background:transparent}
.loading{padding:30px 0;text-align:center;color:var(--muted);font-size:13px}

@media (max-width:600px){
  .head{gap:12px;padding:16px 4px}
  .badge{width:36px;height:36px}.badge svg{width:19px;height:19px}
  .sub{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  .body,.chev{transition:none}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="acc" id="acc"></div>
</div>

<script>
/* ============================================================
   THE PANELS — edit titles here.
   src  : the graphic to load (a page in this same folder)
   sub  : the line under the title. {people}, {countries} and
          {disciplines} are filled in from data/signups.json.
   open : true to have the panel open when the page loads.
   ============================================================ */
var PANELS = [
  { title:"Where are participants coming from?",
    sub:"{people} people from {countries} countries so far",
    src:"community-map-embed.html", icon:"globe" },
  { title:"What are participants studying?",
    sub:"Areas of interest and disciplines, and how they connect",
    src:"community-interests-embed.html", icon:"bars" }
];

/* ------------------------------------------------------------
   Machinery below. You should not need to touch it.
   ------------------------------------------------------------ */
(function(){
  var ICONS={
    globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
    bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h14M4 12h10M4 18h16"/></svg>'
  };
  var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var acc=document.getElementById('acc'), items=[];

  PANELS.forEach(function(p,i){
    var it=document.createElement('div'); it.className='item';
    var bid='b'+i, hid='h'+i;
    it.innerHTML=
      '<button class="head" id="'+hid+'" aria-expanded="false" aria-controls="'+bid+'">'+
        '<span class="badge" aria-hidden="true">'+(ICONS[p.icon]||'')+'</span>'+
        '<span class="txt"><span class="title"></span><span class="sub"></span></span>'+
        '<span class="chev" aria-hidden="true">'+CHEV+'</span>'+
      '</button>'+
      '<div class="body" id="'+bid+'" role="region" aria-labelledby="'+hid+'"><div class="inner"></div></div>';
    it.querySelector('.title').textContent=p.title;
    it.querySelector('.sub').textContent=p.sub.replace(/\{\w+\}/g,'…');
    acc.appendChild(it);
    var o={p:p,el:it,head:it.querySelector('.head'),body:it.querySelector('.body'),
           inner:it.querySelector('.inner'),sub:it.querySelector('.sub'),frame:null,open:false};
    o.head.addEventListener('click',function(){ toggle(o); });
    items.push(o);
  });

  // Fill the subtitles from the same data the graphics use.
  fetch('data/signups.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
    var vals={people:d.total,
              countries:Object.keys(d.countries).filter(function(k){return k!=='Unknown';}).length,
              disciplines:Object.keys(d.disciplines).length};
    items.forEach(function(o){
      o.sub.textContent=o.p.sub.replace(/\{(\w+)\}/g,function(m,k){return vals[k]!=null?vals[k]:m;});
    });
  }).catch(function(){
    items.forEach(function(o){ o.sub.textContent=o.p.sub.indexOf('{')<0?o.p.sub:''; });
  });

  function toggle(o){
    o.open=!o.open;
    o.el.classList.toggle('open',o.open);
    o.head.setAttribute('aria-expanded',o.open);
    if(o.open && !o.frame){
      // First open: load the graphic now so its animation plays in view.
      o.inner.innerHTML='<div class="loading">Loading…</div>';
      var f=document.createElement('iframe');
      f.src=o.p.src; f.title=o.p.title; f.loading='eager';
      f.setAttribute('scrolling','no');
      o.inner.appendChild(f); o.frame=f;
      f.addEventListener('load',function(){ var l=o.inner.querySelector('.loading'); if(l) l.remove(); size(o); });
    }
    size(o);
  }

  // Animate the panel to the height of its content (or to zero).
  function size(o){
    var h=o.open?o.inner.scrollHeight:0;
    o.body.style.height=h+'px';
    setTimeout(report,480); report();
  }

  // Each graphic tells us its height (the same message it would send to Wix).
  window.addEventListener('message',function(e){
    var d=e.data; if(!d||d.type!=='imhws-height'||!(d.height>0)) return;
    items.forEach(function(o){
      if(o.frame && o.frame.contentWindow===e.source){
        o.frame.style.height=d.height+'px';
        if(o.open) size(o);
      }
    });
  });

  items.forEach(function(o){ if(o.p.open) toggle(o); });

  /* ---- tell the host page (Wix) how tall we are ---- */
  var last=0;
  function report(){
    var h=Math.ceil(document.getElementById('wrap').getBoundingClientRect().height)+8;
    if(Math.abs(h-last)<2) return; last=h;
    parent.postMessage({type:'imhws-height',height:h},'*');
  }
  window.addEventListener('load',report);
  window.addEventListener('resize',function(){ items.forEach(function(o){ if(o.open) size(o); }); report(); });
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
