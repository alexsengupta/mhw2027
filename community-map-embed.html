<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMHWS-1 community map</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IMHWS-1 "WHERE OUR COMMUNITY IS COMING FROM" — embeddable widget

   Self-contained apart from the font. Reads its numbers from
   data/signups.json, so updating the data never means editing this
   file. See tools/README-signups.md.

   The only thing you might need to edit here is the PLACES table in
   the script, if someone signs up from a country it does not list
   yet. The page tells you in the browser console when that happens.
   ============================================================ */
:root{
  --ink:#1d2b39; --muted:#6f8295; --navy:#0c356a; --blue:#0b5aaf;
  --teal:#3f9fc4; --amber:#ffad3d; --orange:#ff9a2e; --red:#df2a2f;
  --land:#bccfe3; --chip:#f1f6fb; --rule:#dde7f2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;overflow-x:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:4px 16px 12px}

/* ---- headline numbers ---- */
.stats{display:flex;justify-content:center;gap:clamp(22px,7vw,72px);margin:0 0 6px}
.stat{text-align:center;min-width:0}
.num{display:block;font-size:clamp(34px,6vw,52px);font-weight:800;line-height:1;color:var(--navy);letter-spacing:-.02em}
.stat:nth-child(2) .num{color:var(--blue)}
.stat:nth-child(3) .num{color:#e2701f}
.cap{display:block;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---- the map ---- */
.map{position:relative;margin-top:8px}
svg{display:block;width:100%;height:auto;overflow:visible}
.land{fill:none;stroke:var(--land);stroke-width:3;stroke-linecap:round}
.arc{fill:none;stroke-linecap:round;opacity:.62;transition:opacity .25s ease,stroke-width .25s ease}
.bub{fill:rgba(11,90,175,.16);stroke:var(--blue);stroke-width:1.4;
     transform-box:fill-box;transform-origin:center;transform:scale(0);
     transition:transform .7s cubic-bezier(.3,1.5,.5,1),fill .2s ease}
.ready .bub{transform:scale(1)}
.bub.au{fill:rgba(223,42,47,.10);stroke:#e2701f}
.hit{fill:transparent;cursor:pointer}
.dim .arc{opacity:.12}
.dim .bub{opacity:.35}
.dim .arc.on{opacity:1}
.dim .bub.on{opacity:1;fill:rgba(11,90,175,.35)}
.spark{fill:#fff3dc}
.perth{fill:var(--red);stroke:#a81d1d;stroke-width:1.5}
.ping{fill:none;stroke:var(--red);stroke-width:2;transform-box:fill-box;transform-origin:center;
      animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite}
.ping.b{animation-delay:1.3s}
@keyframes ping{0%{transform:scale(.6);opacity:.7}80%{transform:scale(3.4);opacity:0}100%{opacity:0}}
.plabel{font-size:15px;font-weight:800;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.psub{font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:var(--red);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}

/* ---- tooltip ---- */
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--rule);border-radius:10px;
     box-shadow:0 6px 22px rgba(12,53,106,.14);padding:8px 12px;font-size:13px;line-height:1.35;
     transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .15s ease;white-space:nowrap;z-index:5}
.tip.show{opacity:1}
.tip b{display:block;font-size:14px}
.tip span{color:var(--muted)}

/* ---- country list (also the accessible version of the map) ---- */
.list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.list li{font-size:13px;background:var(--chip);border-radius:999px;padding:5px 11px;cursor:default;
         opacity:0;transform:translateY(4px);transition:opacity .4s ease,transform .4s ease,background .2s ease}
.ready .list li{opacity:1;transform:none}
.list li b{font-weight:700;margin-left:4px;color:var(--navy)}
.list li:hover,.list li:focus,.list li.on{background:#dceafa;outline:none}
.more{display:none;margin:10px auto 0;font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:none;border:1px solid var(--rule);border-radius:999px;padding:6px 14px;cursor:pointer}
.foot{margin:12px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.err{text-align:center;color:var(--muted);padding:40px 0}

@media (max-width:600px){
  .plabel{font-size:22px;stroke-width:6px}.psub{display:none}
  .list li{font-size:12px;padding:4px 9px}
  .list.collapsed li:nth-child(n+13){display:none}
  .more.need{display:block}
  .cap{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .bub,.list li{transition:none}
  .ping{animation:none;display:none}
}
</style>
</head>

  function draw(data){
    var total=data.total, rows=[], continents={};
    Object.keys(data.countries).forEach(function(name){
      var n=data.countries[name], p=PLACES[name];
      if(!p){ if(name!=='Unknown') console.warn('No map position for "'+name+'" — add it to PLACES.'); return; }
      continents[p[2]]=1;
      rows.push({name:name,n:n,xy:project(p[0],p[1]),cont:p[2]});
    });
    var nCountries=Object.keys(data.countries).filter(function(k){return k!=='Unknown';}).length;

    countUp('nPeople',total); countUp('nCountries',nCountries);
    countUp('nContinents',Object.keys(continents).length);
    document.getElementById('foot').textContent='Based on expressions of interest received up to '
      +fmtDate(data.updated)+'. Hover or tap a circle for numbers.';

    var P=project(PERTH[0],PERTH[1]);
    var defs=document.getElementById('defs'), gA=document.getElementById('arcs'),
        gB=document.getElementById('bubbles'), gS=document.getElementById('sparks'),
        gP=document.getElementById('perth'), list=document.getElementById('list');
    var mobile=window.innerWidth<600, rScale=mobile?1.5:1;

    // Smallest first so big circles are drawn underneath? No: big first, small on top.
    rows.sort(function(a,b){return b.n-a.n;});
    var arcs=[];
    rows.forEach(function(r,i){
      var x0=r.xy[0],y0=r.xy[1],x1=P[0],y1=P[1];
      var dx=x1-x0,dy=y1-y0,dist=Math.sqrt(dx*dx+dy*dy);
      // Bend each arc upward (away from the equator side) by a third of its length.
      var mx=(x0+x1)/2,my=(y0+y1)/2,nx=-dy/dist,ny=dx/dist;
      if(ny>0){nx=-nx;ny=-ny;}
      var bend=Math.min(dist*0.32,170);
      var cx=mx+nx*bend, cy=my+ny*bend;
      var d='M'+x0.toFixed(1)+' '+y0.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+x1.toFixed(1)+' '+y1.toFixed(1);

      var gid='g'+i;
      var grad=el('linearGradient',{id:gid,gradientUnits:'userSpaceOnUse',x1:x0,y1:y0,x2:x1,y2:y1},defs);
      el('stop',{offset:'0','stop-color':'#3f9fc4'},grad);
      el('stop',{offset:'.55','stop-color':'#ffad3d'},grad);
      el('stop',{offset:'1','stop-color':'#df2a2f'},grad);

      var w=Math.min(1+0.38*Math.sqrt(r.n),4.2)*rScale;
      var path=el('path',{d:d,'class':'arc',stroke:'url(#'+gid+')','stroke-width':w.toFixed(2)},gA);
      var len=path.getTotalLength();
      if(!reduce){
        path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
        path.style.transition='stroke-dashoffset 1.5s cubic-bezier(.5,0,.2,1) '+(0.35+i*0.045)+'s';
      }
      // Pre-sample the curve so the sparks do not call getPointAtLength every frame.
      var pts=[]; for(var k=0;k<=80;k++){var q=path.getPointAtLength(len*k/80);pts.push([q.x,q.y]);}

      var rad=(2.4+2.5*Math.sqrt(r.n))*rScale;
      var bub=el('circle',{cx:x0,cy:y0,r:rad.toFixed(1),'class':'bub'+(r.name==='Australia'?' au':'')},gB);
      bub.style.transitionDelay=(0.2+i*0.045)+'s';
      var hit=el('circle',{cx:x0,cy:y0,r:Math.max(rad+5,12*rScale),'class':'hit',tabindex:'0',
        'aria-label':r.name+': '+r.n+(r.n===1?' person':' people')},gB);

      var li=document.createElement('li'); li.tabIndex=0;
      li.innerHTML=r.name+'<b>'+r.n+'</b>';
      li.style.transitionDelay=(0.8+i*0.03)+'s';
      list.appendChild(li);

      var a={r:r,path:path,bub:bub,li:li,pts:pts,len:len};
      arcs.push(a);
      [hit,li].forEach(function(t){
        t.addEventListener('mouseenter',function(){focusOn(a);});
        t.addEventListener('focus',function(){focusOn(a);});
        t.addEventListener('mouseleave',clear);
        t.addEventListener('blur',clear);
      });
      hit.addEventListener('click',function(e){e.stopPropagation();focusOn(a);});
    });
    document.addEventListener('click',clear);

    // On phones, show the top twelve countries and a button for the rest.
    var more=document.getElementById('more');
    if(rows.length>12){
      list.classList.add('collapsed'); more.classList.add('need');
      more.textContent='Show all '+rows.length+' countries';
      more.addEventListener('click',function(e){
        e.stopPropagation();
        var c=list.classList.toggle('collapsed');
        more.textContent=c?'Show all '+rows.length+' countries':'Show fewer';
        report();
      });
    }

    // Perth marker and label
    el('circle',{cx:P[0],cy:P[1],r:7*rScale,'class':'ping'},gP);
    el('circle',{cx:P[0],cy:P[1],r:7*rScale,'class':'ping b'},gP);
    el('circle',{cx:P[0],cy:P[1],r:6.5*rScale,'class':'perth'},gP);
    var t1=el('text',{x:P[0]-14*rScale,y:P[1]+5,'text-anchor':'end','class':'plabel'},gP); t1.textContent='Perth';
    var t2=el('text',{x:P[0]-14*rScale,y:P[1]+21,'text-anchor':'end','class':'psub'},gP); t2.textContent='SEPT 2027';

    // ---- tooltip / highlight ----
    var svg=document.getElementById('svg'), tip=document.getElementById('tip'), map=document.getElementById('map');
    function focusOn(a){
      svg.classList.add('dim');
      arcs.forEach(function(b){var on=b===a;b.path.classList.toggle('on',on);b.bub.classList.toggle('on',on);b.li.classList.toggle('on',on);});
      var pct=Math.round(100*a.r.n/total);
      tip.innerHTML='<b>'+a.r.name+'</b>'+a.r.n+(a.r.n===1?' person':' people')+' <span>· '+(pct<1?'<1':pct)+'%</span>';
      var box=svg.getBoundingClientRect(), mb=map.getBoundingClientRect(), s=box.width/W;
      tip.style.left=(a.r.xy[0]*s+box.left-mb.left)+'px';
      tip.style.top=(a.r.xy[1]*s+box.top-mb.top-parseFloat(a.bub.getAttribute('r'))*s)+'px';
      tip.classList.add('show');
    }
    function clear(){
      svg.classList.remove('dim'); tip.classList.remove('show');
      arcs.forEach(function(b){b.path.classList.remove('on');b.bub.classList.remove('on');b.li.classList.remove('on');});
    }

    // ---- reveal ----
    requestAnimationFrame(function(){
      document.getElementById('wrap').classList.add('ready');
      arcs.forEach(function(a){a.path.style.strokeDashoffset=0;});
      report();
    });

    // ---- sparks travelling to Perth ----
    // Each country sends sparks in proportion to the square root of its
    // numbers, so big countries are busier without drowning out the rest.
    if(reduce) return;
    var sparks=[];
    arcs.forEach(function(a){
      var k=Math.max(1,Math.round(Math.sqrt(a.r.n)*0.8));
      for(var j=0;j<k;j++){
        var c=el('circle',{r:(1.6*rScale).toFixed(1),'class':'spark',opacity:0},gS);
        sparks.push({a:a,c:c,t:-(j/k)-Math.random()*0.6-2.2,speed:1/(2.6+a.len/260)});
      }
    });
    var running=true, lastT=null;
    function frame(ts){
      if(!running){lastT=null;return;}
      if(lastT===null) lastT=ts;
      var dt=Math.min((ts-lastT)/1000,0.05); lastT=ts;
      for(var i=0;i<sparks.length;i++){
        var s=sparks[i]; s.t+=dt*s.speed;
        if(s.t>=1) s.t-=1+Math.random()*0.5;
        if(s.t<0){s.c.setAttribute('opacity',0);continue;}
        var f=s.t*80, k=Math.floor(f), u=f-k, p0=s.a.pts[k], p1=s.a.pts[Math.min(k+1,80)];
        s.c.setAttribute('cx',(p0[0]+(p1[0]-p0[0])*u).toFixed(1));
        s.c.setAttribute('cy',(p0[1]+(p1[1]-p0[1])*u).toFixed(1));
        s.c.setAttribute('opacity',(Math.sin(Math.PI*s.t)*0.95).toFixed(2));
      }
      requestAnimationFrame(frame);
    }
    function setRunning(on){ if(on&&!running){running=true;requestAnimationFrame(frame);} running=on; }
    requestAnimationFrame(frame);
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){setRunning(es[0].isIntersecting);}).observe(svg);
    }
    document.addEventListener('visibilitychange',function(){setRunning(!document.hidden);});
  }

  function countUp(id,target){
    var e=document.getElementById(id);
    if(reduce){e.textContent=target;return;}
    var t0=null,dur=1400;
    function step(ts){ if(t0===null)t0=ts; var p=Math.min((ts-t0)/dur,1);
      e.textContent=Math.round(target*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  /* ---- tell the host page how tall we are (same message as the timeline) ---- */
  var last=0;
  function report(){
    var h=Math.ceil(document.getElementById('wrap').getBoundingClientRect().height)+12;
    if(Math.abs(h-last)<2) return; last=h;
    parent.postMessage({type:'imhws-height',height:h},'*');
  }
  window.addEventListener('load',report);
  window.addEventListener('resize',report);
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
