<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMHWS-1 community interests</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IMHWS-1 "WHAT OUR COMMUNITY WORKS ON" — embeddable widget

   Two linked bar charts: areas of interest and disciplines. Hover or
   tap a bar on one side and the other side re-draws for just those
   people, with a small tick marking the overall figure for comparison.

   Reads data/signups.json. Nothing in this file needs editing when
   the numbers change. See tools/README-signups.md.

   SHORT LABELS: the form's category names are long. The LABELS table
   in the script gives the wording shown on screen. A category that is
   not in the table is shown under its full name.
   ============================================================ */
:root{
  --ink:#1d2b39; --muted:#6f8295; --navy:#0c356a; --blue:#0b5aaf;
  --track:#edf2f8; --rule:#dde7f2; --tick:#1d2b39;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;overflow-x:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:4px 16px 12px}

.lede{text-align:center;font-size:clamp(16px,2.1vw,19px);line-height:1.5;margin:0 auto 22px;max-width:760px;color:#33475b}
.lede b{color:var(--navy);font-weight:800}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px)}
.panel h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctx{display:block;min-height:2.7em;margin:4px 0 10px;font-size:13.5px;line-height:1.35;color:var(--muted)}
.ctx b{color:var(--ink);font-weight:700}

.bars{list-style:none;margin:0;padding:0}
.bar{padding:7px 8px 9px;margin:0 -8px;border-radius:10px;cursor:pointer;outline:none;
     transition:background .2s ease,opacity .25s ease}
.bar:hover,.bar:focus-visible,.bar.sel{background:#f3f7fb}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.name{font-size:14.5px;font-weight:600;line-height:1.3}
.val{font-size:14.5px;font-weight:800;color:var(--navy);white-space:nowrap}
.val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
.track{position:relative;height:10px;border-radius:5px;background:var(--track)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;
      transition:width 1.1s cubic-bezier(.22,.8,.3,1)}
.interests .fill{background:linear-gradient(90deg,#0b5aaf,#3f9fc4)}
.disciplines .fill{background:linear-gradient(90deg,#ffad3d,#e2701f)}
.bar.other .fill{background:#b9c6d3}
.bar.other .name{color:var(--muted)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--tick);
      opacity:0;transition:left 1.1s cubic-bezier(.22,.8,.3,1),opacity .3s ease}
.filtered .tick{opacity:.55}

/* when one bar is selected, its own panel quietens the rest */
.has-sel .bar:not(.sel){opacity:.45}

.foot{margin:18px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.foot i{display:inline-block;width:2px;height:12px;background:var(--tick);opacity:.55;vertical-align:-2px;margin:0 4px}
.err{text-align:center;color:var(--muted);padding:40px 0}

@media (max-width:760px){
  .panels{grid-template-columns:1fr;gap:28px}
  .ctx{min-height:0}
}
@media (prefers-reduced-motion:reduce){
  .fill,.tick{transition:none}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <p class="lede" id="lede"></p>
  <div class="panels">
    <section class="panel interests" id="pI">
      <h3>Areas of interest</h3>
      <span class="ctx" id="ctxI"></span>
      <ol class="bars" id="barsI"></ol>
    </section>
    <section class="panel disciplines" id="pD">
      <h3>Disciplines</h3>
      <span class="ctx" id="ctxD"></span>
      <ol class="bars" id="barsD"></ol>
    </section>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script>
/* On-screen wording for each category. Left: exactly as in signups.json. */
var LABELS = {
  "Marine ecosystem impacts":"Ecosystem impacts",
  "Extreme events and climate variability":"Extremes & climate variability",
  "Marine heatwave processes":"Marine heatwave processes",
  "Adaptation, risk assessment and management responses":"Adaptation, risk & management",
  "Forecasting and prediction":"Forecasting & prediction",
  "Fisheries and aquaculture impacts":"Fisheries & aquaculture",
  "Other":"Something else"
};

/* ------------------------------------------------------------
   Machinery below. You should not need to touch it.
   ------------------------------------------------------------ */
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var D, sel=null, built=false;

  fetch('data/signups.json',{cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ D=d; build(); })
    .catch(function(e){
      document.getElementById('wrap').innerHTML='<p class="err">These charts could not load just now.</p>';
      console.error(e); report();
    });

  function label(k){ return LABELS[k]||k; }
  function pct(a,b){ return b?100*a/b:0; }
  function order(obj){ // by count, with "Other" always last
    return Object.keys(obj).sort(function(a,b){
      if(a==='Other') return 1; if(b==='Other') return -1; return obj[b]-obj[a];
    });
  }
  function fmtDate(s){
    var d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
    return d.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  }

  // Cross-tab lookups, in both directions.
  function cross(i,d){ return (D.cross[i]&&D.cross[i][d])||0; }

  var rowsI=[], rowsD=[];
  function build(){
    var multi=Math.round(pct(D.multi_discipline,D.answered_discipline));
    var mean=D.mean_interests;
    document.getElementById('lede').innerHTML=
      'People ticked <b>'+(Math.round(mean*10)/10)+'</b> areas of interest on average, and <b>'+
      fraction(multi)+'</b> work across more than one discipline. Hover or tap a bar to see how the two sides connect.';
    document.getElementById('foot').innerHTML=
      'Share of people who answered each question; people could choose several, so bars do not add to 100%. '+
      '<i></i> marks the overall figure when a bar is selected. Up to '+fmtDate(D.updated)+'.';

    rowsI=make('barsI',order(D.interests),'I');
    rowsD=make('barsD',order(D.disciplines),'D');
    setContext();

    // Grow the bars the first time the widget scrolls into view.
    var go=function(){ if(built) return; built=true; render(); };
    if(reduce||!('IntersectionObserver' in window)) go();
    else new IntersectionObserver(function(es,o){ if(es[0].isIntersecting){ o.disconnect(); setTimeout(go,150);} },{threshold:.25})
           .observe(document.getElementById('wrap'));
    document.addEventListener('click',function(){ if(sel){ sel=null; update(); } });
    report();
  }

  function fraction(p){
    // A friendlier phrasing than a bare percentage for the lede.
    var f=[[1/2,'half'],[2/3,'two in three'],[3/5,'three in five'],[3/4,'three in four'],[1/3,'one in three'],[2/5,'two in five']];
    var best=null; f.forEach(function(x){ if(Math.abs(x[0]*100-p)<=2.5) best=x[1]; });
    return best||p+'%';
  }

  function make(id,keys,side){
    var ol=document.getElementById(id), rows=[];
    keys.forEach(function(k,i){
      var li=document.createElement('li');
      li.className='bar'+(k==='Other'?' other':''); li.tabIndex=0;
      li.innerHTML='<div class="top"><span class="name"></span><span class="val"><span class="v">0%</span><small></small></span></div>'+
                   '<div class="track"><span class="fill"></span><span class="tick"></span></div>';
      li.querySelector('.name').textContent=label(k);
      li.querySelector('.fill').style.transitionDelay=(reduce?0:i*0.07)+'s';
      var r={k:k,side:side,li:li,fill:li.querySelector('.fill'),tick:li.querySelector('.tick'),
             v:li.querySelector('.v'),n:li.querySelector('small'),shown:0};
      li.addEventListener('mouseenter',function(){ if(!locked) choose(r); });
      li.addEventListener('mouseleave',function(){ if(!locked) choose(null); });
      li.addEventListener('focus',function(){ choose(r); });
      li.addEventListener('click',function(e){ e.stopPropagation(); locked=(sel===r)?false:true; choose(locked?r:null); });
      li.addEventListener('keydown',function(e){ if(e.key==='Escape'){ locked=false; choose(null); li.blur(); } });
      ol.appendChild(li); rows.push(r);
    });
    return rows;
  }
  var locked=false;

  function choose(r){ if(sel===r) return; sel=r; update(); }

  // The overall share for every bar.
  function overall(r){
    return r.side==='I' ? {n:D.interests[r.k],p:pct(D.interests[r.k],D.answered_interest)}
                        : {n:D.disciplines[r.k],p:pct(D.disciplines[r.k],D.answered_discipline)};
  }
  // The share for a bar on the OTHER side from the selected one.
  function within(r){
    if(r.side==='D'){ var base=D.interest_n_both[sel.k]||0, n=cross(sel.k,r.k); return {n:n,p:pct(n,base)}; }
    var base2=D.discipline_n_both[sel.k]||0, n2=cross(r.k,sel.k); return {n:n2,p:pct(n2,base2)};
  }

  function render(){
    // Common scale across both panels, so a long bar means the same on each side.
    var all=rowsI.concat(rowsD), max=0, vals=[];
    all.forEach(function(r){
      var o=overall(r), s=(sel&&r.side!==sel.side)?within(r):o;
      vals.push({r:r,o:o,s:s}); max=Math.max(max,s.p,o.p);
    });
    max=Math.max(max,1);
    vals.forEach(function(x){
      x.r.fill.style.width=(100*x.s.p/max).toFixed(2)+'%';
      x.r.tick.style.left=(100*x.o.p/max).toFixed(2)+'%';
      animateNum(x.r,Math.round(x.s.p));
      x.r.n.textContent=x.s.n+(x.s.n===1?' person':' people');
    });
  }

  function update(){
    var pI=document.getElementById('pI'), pD=document.getElementById('pD');
    pI.classList.toggle('has-sel',!!sel&&sel.side==='I');
    pD.classList.toggle('has-sel',!!sel&&sel.side==='D');
    pI.classList.toggle('filtered',!!sel&&sel.side==='D');
    pD.classList.toggle('filtered',!!sel&&sel.side==='I');
    rowsI.concat(rowsD).forEach(function(r){ r.li.classList.toggle('sel',r===sel); });
    setContext();
    if(built) render();
  }

  function setContext(){
    var cI=document.getElementById('ctxI'), cD=document.getElementById('ctxD');
    if(!sel){
      cI.innerHTML='Share of the '+D.answered_interest+' people who answered';
      cD.innerHTML='Share of the '+D.answered_discipline+' people who answered';
    } else if(sel.side==='I'){
      cI.innerHTML='Showing the disciplines of people interested in <b>'+label(sel.k).toLowerCase()+'</b>';
      cD.innerHTML='Among the '+(D.interest_n_both[sel.k]||0)+' people interested in <b>'+label(sel.k).toLowerCase()+'</b> who gave a discipline';
    } else {
      cD.innerHTML='Showing the interests of people in <b>'+label(sel.k).toLowerCase()+'</b> who gave an interest';
      cI.innerHTML='Among the '+(D.discipline_n_both[sel.k]||0)+' people in <b>'+label(sel.k).toLowerCase()+'</b> who gave an interest';
    }
    // Flag small groups, where a single person moves a bar a long way.
    var base = !sel ? 99 : (sel.side==='I' ? D.interest_n_both[sel.k] : D.discipline_n_both[sel.k]) || 0;
    if(sel && base<20){
      (sel.side==='I'?cD:cI).innerHTML += ' <span style="white-space:nowrap">(a small group, so read with care)</span>';
    }
    report();
  }

  function animateNum(r,to){
    var from=r.shown; r.shown=to;
    if(reduce||from===to){ r.v.textContent=to+'%'; return; }
    var t0=null,dur=900;
    function step(ts){ if(t0===null)t0=ts; var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,3);
      r.v.textContent=Math.round(from+(to-from)*e)+'%'; if(p<1&&r.shown===to) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  /* ---- tell the host page how tall we are (same message as the timeline) ---- */
  var last=0;
  function report(){
    var w=document.getElementById('wrap'); if(!w) return;
    var h=Math.ceil(w.getBoundingClientRect().height)+12;
    if(Math.abs(h-last)<2) return; last=h;
    parent.postMessage({type:'imhws-height',height:h},'*');
  }
  window.addEventListener('load',report);
  window.addEventListener('resize',report);
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
