  <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#0b5aaf"/><stop offset=".30" stop-color="#3f9fc4"/>
    <stop offset=".50" stop-color="#7bc6c6"/><stop offset=".72" stop-color="#ffad3d"/>
    <stop offset=".87" stop-color="#ff9a2e"/><stop offset="1"   stop-color="#df2a2f"/>
  </linearGradient>
</defs>
