<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1034" width="440" height="1034" role="img" aria-labelledby="ttl2 desc2" font-family="'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl2">Marine heatwaves and their impacts</title>
<desc id="desc2">Marine heatwaves are prolonged, discrete periods of anomalously warm water. Documented consequences fall into four groups: habitats collapse, with kelp forests razed, coral bleached and killed and seagrass meadows lost; mass mortality of fish, invertebrates, seabirds and marine mammals; species on the move, with ranges shifting poleward, harmful algal blooms and disease; and livelihoods hit, through fishery closures and quota cuts, aquaculture mortalities and losses to tourism and coastal towns. There are 54 per cent more marine heatwave days than a century ago, eight of the ten most severe events on record have happened since 2010, more than 34 events have documented social and economic impacts, and a single event cost US$3.1 billion a year in indirect losses. Source: Smith and others, Socioeconomic impacts of marine heatwaves, Science volume 374, 2021.</desc>
